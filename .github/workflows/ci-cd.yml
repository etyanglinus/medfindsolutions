name: CI / Deploy

# Tests run on every push and pull request.
# A push to main (e.g. merging a pull request) releases to the live cPanel site once tests pass.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:   # "Run workflow" button: re-run tests + deploy main by hand

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      # vendor/ is committed, so no composer install is needed.
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check PHP syntax of changed app code
        run: find app routes config database -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run tests
        run: php artisan test --exclude-group known-failing

  deploy:
    # The host does not allow inbound SSH, so deployment is pull-based:
    # this job moves the `production` branch to the tested commit, and a cron job on the server
    # (scripts/cron-deploy.sh, every minute) pulls it and runs scripts/deploy.sh.
    name: Release to production
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # to move the production branch
    environment:
      name: production
      url: https://medfindsolutions.co.ke
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move production branch to the tested commit
        run: git push origin "${GITHUB_SHA}:refs/heads/production"

      - name: Wait for the server to deploy it
        run: |
          want="${GITHUB_SHA:0:8}"
          echo "Waiting for https://medfindsolutions.co.ke/__release to report $want (server cron checks every minute)"
          for i in $(seq 1 40); do
            body=$(curl -s --max-time 15 -w '\n%{http_code}' https://medfindsolutions.co.ke/__release || true)
            code=$(printf '%s' "$body" | tail -n1); got=$(printf '%s' "$body" | sed '$d' | head -c 40)
            if [ "$code" = 200 ]; then echo "  live version: $got"; else echo "  /__release answered HTTP ${code:-none} (server still on an older version)"; fi
            [ "$code" = 200 ] && [ "$got" = "$want" ] && { echo "Deployed."; exit 0; }
            sleep 15
          done
          echo "::error::The server did not deploy $want within 10 minutes. On the server, check: tail -n 60 ~/medfind-deploy.log"
          exit 1

      - name: Smoke test
        run: |
          for path in / /facilities /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "https://medfindsolutions.co.ke$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || { echo "::error::$path returned $code after deploy"; exit 1; }
          done
